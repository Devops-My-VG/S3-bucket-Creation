name: S3 Bucket - Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DESTROY" to confirm'
        required: true
        default: 'no'
      force:
        description: 'Force delete objects before destroy'
        required: true
        default: true
        type: boolean

concurrency:
  group: s3-bucket-destroy
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION:    ${{ secrets.AWS_DEFAULT_REGION }}
  AWS_REGION:            ${{ secrets.AWS_DEFAULT_REGION }}
  BUCKET_NAME:           ${{ vars.BUCKET_NAME }}

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DESTROY" ]; then
            echo "Confirmation failed. Expected 'DESTROY', got '${{ github.event.inputs.confirm }}'"
            exit 1
          fi

  destroy:
    needs: guard
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Debug AWS env
        run: |
          echo "Access Key Length: ${#AWS_ACCESS_KEY_ID}"
          aws sts get-caller-identity

      - name: Terraform init
        run: terraform init

      - name: Force delete objects
        if: github.event.inputs.force == 'true'
        run: |
          BUCKET="${BUCKET_NAME}"
          if [ -z "$BUCKET" ] || [ "$BUCKET" == "null" ]; then
            ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
            BUCKET="terraform-infra-bucket-$ACCOUNT"
          fi

          echo "Emptying bucket: $BUCKET"
          # Only attempt if bucket exists
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3 rm "s3://$BUCKET" --recursive

            VERSIONS=$(aws s3api list-object-versions --bucket "$BUCKET")
            # Using jq to extract objects to delete
            VERSIONS_TO_DELETE=$(echo "$VERSIONS" | jq -r '{Objects: [.Versions[]? | {Key: .Key, VersionId: .VersionId}], Quiet: true} | select(.Objects | length > 0)')
            MARKERS_TO_DELETE=$(echo "$VERSIONS" | jq -r '{Objects: [.DeleteMarkers[]? | {Key: .Key, VersionId: .VersionId}], Quiet: true} | select(.Objects | length > 0)')

            if [ ! -z "$VERSIONS_TO_DELETE" ]; then
              echo "$VERSIONS_TO_DELETE" > versions.json
              aws s3api delete-objects --bucket "$BUCKET" --delete file://versions.json
            fi

            if [ ! -z "$MARKERS_TO_DELETE" ]; then
              echo "$MARKERS_TO_DELETE" > markers.json
              aws s3api delete-objects --bucket "$BUCKET" --delete file://markers.json
            fi
          else
            echo "Bucket $BUCKET does not exist. Skipping."
          fi

      - name: Terraform destroy
        run: terraform destroy -auto-approve -var="force_destroy=${{ github.event.inputs.force }}"

      - name: Fallback cleanup
        if: always()
        run: |
          BUCKET="${BUCKET_NAME}"
          if [ -z "$BUCKET" ] || [ "$BUCKET" == "null" ]; then
            ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
            BUCKET="terraform-infra-bucket-$ACCOUNT"
          fi
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Bucket $BUCKET still exists, forcing removal."
            aws s3 rb "s3://$BUCKET" --force
          fi
