name: S3 Bucket - Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DESTROY" to confirm'
        required: true
        default: 'no'
      force:
        description: 'Force delete objects before destroy'
        required: true
        default: true
        type: boolean

concurrency:
  group: s3-bucket-destroy
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION:    ${{ secrets.AWS_DEFAULT_REGION }}
  AWS_REGION:            ${{ secrets.AWS_DEFAULT_REGION }}
  BUCKET_NAME:           terraform-infra-metadata-<AWS_ACCOUNT_ID>

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DESTROY" ]; then
            echo "Confirmation failed. Expected 'DESTROY', got '${{ github.event.inputs.confirm }}'"
            exit 1
          fi

  destroy:
    needs: guard
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Debug AWS identity
        run: aws sts get-caller-identity
      - name: Terraform init
        run: terraform init
      - name: Terraform state list
        run: terraform state list || echo "(no state)"
      - name: Terraform destroy
        run: terraform destroy -auto-approve
      - name: Fallback cleanup
        if: always()
        run: |
          if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "Bucket still exists — forcing delete..."
            aws s3 rb "s3://$BUCKET_NAME" --force || true
          else
            echo "Bucket is gone."
          fi
